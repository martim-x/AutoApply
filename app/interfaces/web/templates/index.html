<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ app_name }}</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="shell">
    <header class="top">
      <div>
        <p class="brand">{{ app_name }}</p>
        <p class="tag">rabota.by · поиск · приоритет · отклик с письмом</p>
      </div>
      <div class="status-pill" id="statusPill" data-status="idle">
        <span class="dot"></span>
        <span id="statusLabel">idle</span>
      </div>
    </header>

    <section class="controls">
      <label class="field">
        <span>Профиль</span>
        <div class="row">
          <select id="profileSelect"></select>
          <input id="newProfile" type="text" placeholder="новый профиль" maxlength="64" />
          <button type="button" id="btnAddProfile" class="ghost">+</button>
        </div>
      </label>

      <div class="actions">
        <button type="button" id="btnLogin" class="primary">Login / Connect</button>
        <button type="button" id="btnConfirm" class="ghost">Сессия сохранена</button>
        <button type="button" id="btnSearch">Start search</button>
        <button type="button" id="btnApply">Start apply</button>
        <button type="button" id="btnStop" class="danger">Stop</button>
      </div>

      <p class="message" id="statusMessage">Готово к работе</p>
    </section>

    <section class="stats" id="statsGrid">
      <div class="stat"><span>HIGH</span><strong id="stHigh">0</strong></div>
      <div class="stat"><span>MEDIUM</span><strong id="stMedium">0</strong></div>
      <div class="stat"><span>LOW</span><strong id="stLow">0</strong></div>
      <div class="stat"><span>Queued</span><strong id="stQueued">0</strong></div>
      <div class="stat"><span>Applied</span><strong id="stApplied">0</strong></div>
      <div class="stat"><span>Session</span><strong id="stSession">нет</strong></div>
    </section>

    <section class="panels">
      <div class="panel">
        <h2>Очередь (HIGH → MEDIUM → LOW)</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Cat</th>
                <th>Score</th>
                <th>Title</th>
                <th>Filter</th>
                <th>Apply</th>
              </tr>
            </thead>
            <tbody id="vacBody"></tbody>
          </table>
        </div>
      </div>
      <div class="panel">
        <h2>Журнал</h2>
        <ul class="log" id="logList"></ul>
      </div>
    </section>

    <footer class="foot">
      <span id="cfgHint"></span>
    </footer>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
