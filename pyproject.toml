[project]
name = "autoapply"
version = "0.1.0"
description = "auto-apply-app: поиск и автоотклики (hh / rabota / LinkedIn) — Web UI + API + Playwright + SQLite"
authors = [{ name = "martim-x" }]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi (>=0.115.0)",
    "uvicorn[standard] (>=0.32.0)",
    "playwright (>=1.50.0)",
    "greenlet (>=3.5.0)",
    "jinja2 (>=3.1.0)",
    "python-multipart (>=0.0.12)",
    "pydantic (>=2.9.0)",
    "pydantic-settings (>=2.6.0)",
    "itsdangerous (>=2.0.0)",
    "reportlab (>=4.2.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "sqlalchemy (>=2.0,<3)",
    "psycopg[binary] (>=3.1,<4)",
]

[project.scripts]
autoapply = "app.main:run"

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
httpx = ">=0.27.0"
ruff = "^0.16.1"
mypy = "^2.3.0"
types-python-dateutil = "^2.9.0.20260716"
types-reportlab = "^4.5.1.20260728"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true
