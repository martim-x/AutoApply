[project]
name = "autoapply"
version = "0.1.0"
description = "Поиск и отклики на rabota.by: Web UI + API + Playwright-воркер + SQLite"
authors = [{ name = "martim-x" }]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi (>=0.115.0)",
    "uvicorn[standard] (>=0.32.0)",
    "playwright (>=1.50.0)",
    "greenlet (>=3.5.0)",
    "jinja2 (>=3.1.0)",
    "python-multipart (>=0.0.12)",
    "pydantic (>=2.9.0)",
    "pydantic-settings (>=2.6.0)",
]

[project.scripts]
autoapply = "app.main:run"

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
httpx = ">=0.27.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
