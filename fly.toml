# Fly.io — auto-apply-app (Playwright + FastAPI + SQLite)
# Docs: docs/fly-io.md
#
# First-time setup:
#   fly apps create auto-apply-app
#   fly volumes create auto_apply_app_data --region ams --size 3
#   fly secrets set ...   # see docs/fly-io.md
#   fly deploy
#
# If you already created an app named "autoapply" (or similar), either:
#   - keep deploying to that existing app name, or
#   - create a new app "auto-apply-app" and migrate the volume/data.

app = "auto-apply-app"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  HEADLESS = "true"
  ENABLE_REMOTE_BROWSER = "true"
  DATA_DIR = "/app/data"
  DATABASE_URL = "sqlite:////app/data/auto_apply_app.sqlite"
  PLAYWRIGHT_BROWSERS_PATH = "/ms-playwright"
  PORT = "8080"
  HOST = "0.0.0.0"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine up for parse/report schedules + SQLite volume.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2

[[mounts]]
  source = "auto_apply_app_data"
  destination = "/app/data"
