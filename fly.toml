# Fly.io — AutoApply (Playwright + FastAPI + SQLite)
# Docs: docs/fly-io.md
#
# First-time setup:
#   fly apps create autoapply
#   fly volumes create autoapply_data --region ams --size 3
#   fly secrets set ...   # see docs/fly-io.md
#   fly deploy

app = "autoapply"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  HEADLESS = "true"
  ENABLE_REMOTE_BROWSER = "true"
  DATA_DIR = "/app/data"
  DATABASE_URL = "sqlite:////app/data/rabota_apply.sqlite"
  PLAYWRIGHT_BROWSERS_PATH = "/ms-playwright"
  PORT = "8080"
  HOST = "0.0.0.0"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine up for parse/report schedules + SQLite volume.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2

[[mounts]]
  source = "autoapply_data"
  destination = "/app/data"
