services:
  auto-apply-app:
    build: .
    container_name: auto-apply-app
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      # Override paths inside container; secrets still from .env
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/auto_apply_app.sqlite}
      DATA_DIR: /app/data
      LETTER_PATH: /app/letters
      LAUNCH_PATH: /app/config/launch.json
      LINKEDIN_LAUNCH_PATH: /app/config/linkedin.launch.json
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      # Hardcode defaults — do NOT use ${HEADLESS:-true}: project .env often has
      # HEADLESS=false for local (non-Docker) DX, and Compose would substitute that
      # into the container → headed Chromium fails (no X server).
      HEADLESS: "true"
      ENABLE_REMOTE_BROWSER: "true"
      HOST: 0.0.0.0
      PORT: 8080
      REPORT_SCHEDULE_ENABLED: ${REPORT_SCHEDULE_ENABLED:-false}
      REPORT_SCHEDULE_TIMEZONE: ${REPORT_SCHEDULE_TIMEZONE:-Europe/Minsk}
      REPORT_SCHEDULE_HOUR: ${REPORT_SCHEDULE_HOUR:-4}
      REPORT_SCHEDULE_MINUTE: ${REPORT_SCHEDULE_MINUTE:-0}
      PARSE_SCHEDULE_ENABLED: ${PARSE_SCHEDULE_ENABLED:-false}
      PARSE_SCHEDULE_TIMEZONE: ${PARSE_SCHEDULE_TIMEZONE:-Europe/Minsk}
      PARSE_SCHEDULE_TIMES: ${PARSE_SCHEDULE_TIMES:-12:00,00:00}
    volumes:
      # Persist sqlite + Playwright sessions + PDF reports.
      # Fresh empty DB: delete ./data/auto_apply_app.sqlite (or set RESET_DB=true once).
      # Legacy rabota_apply.sqlite is renamed to auto_apply_app.sqlite on startup if needed.
      - ./data:/app/data
      - ./letters:/app/letters:ro
      # So /admin can edit .env and changes survive restart
      - ./.env:/app/.env
      - ./config:/app/config
      # Local DX: live-mount app (static/templates/Python) — UI changes without rebuild.
      # Rebuild still required when poetry.lock / Dockerfile / system deps change.
      - ./app:/app/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # For visible browser on Linux host with X11 (optional):
    # environment:
    #   HEADLESS: "false"
    #   DISPLAY: ${DISPLAY}
    # volumes:
    #   - /tmp/.X11-unix:/tmp/.X11-unix
    restart: unless-stopped
