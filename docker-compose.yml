services:
  rabota_apply:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      # Override paths inside container; secrets still from .env
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/rabota_apply.sqlite}
      DATA_DIR: /app/data
      LETTER_PATH: /app/letter_universal.txt
      HEADLESS: ${HEADLESS:-true}
      ENABLE_REMOTE_BROWSER: ${ENABLE_REMOTE_BROWSER:-true}
      HOST: 0.0.0.0
      PORT: 8080
    volumes:
      - ./data:/app/data
      - ./letter_universal.txt:/app/letter_universal.txt:ro
    # For visible browser on Linux host with X11 (optional):
    # environment:
    #   HEADLESS: "false"
    #   DISPLAY: ${DISPLAY}
    # volumes:
    #   - /tmp/.X11-unix:/tmp/.X11-unix
    restart: unless-stopped
